name: Doxygen Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Match your CI versioning style (GitVersion) so docs show the same version.
      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.5.1"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Install Doxygen + Graphviz
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz

      - name: Fetch doxygen-awesome-css
        shell: bash
        run: |
          set -euo pipefail
          rm -rf doxygen-awesome-css
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git doxygen-awesome-css

      - name: Prepare Doxyfile for CI
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the GitVersion SemVer; fall back to the latest tag, then to
          # 0.0.0 so the docs build never fails on a tag-less checkout.
          VERSION="${{ steps.gitversion.outputs.SemVer }}"
          if [ -z "${VERSION}" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          fi
          [ -n "${VERSION}" ] || VERSION="0.0.0"
          echo "DOC VERSION: ${VERSION}"

          cp Doxyfile Doxyfile.ci

          # Paths (repo-root)
          sed -i 's|^IMAGE_PATH *=.*|IMAGE_PATH = "pic/icon" "pic/github"|' Doxyfile.ci
          sed -i 's|^PROJECT_LOGO *=.*|PROJECT_LOGO = "pic/icon/PingDD Icon Small.png"|' Doxyfile.ci
          sed -i 's|^PROJECT_ICON *=.*|PROJECT_ICON = "pic/icon/PingDD Icon Small.png"|' Doxyfile.ci

          # Version shown in docs
          sed -i "s|^PROJECT_NUMBER *=.*|PROJECT_NUMBER = ${VERSION}|" Doxyfile.ci

          # Graphviz: use dot from PATH (runner has it because you install graphviz)
          sed -i 's|^DOT_PATH *=.*|DOT_PATH = |' Doxyfile.ci

          # doxygen-awesome-css (sidebar-only theme)
          sed -i 's|^FULL_SIDEBAR *=.*|FULL_SIDEBAR = NO|' Doxyfile.ci
          sed -i 's|^DISABLE_INDEX *=.*|DISABLE_INDEX = NO|' Doxyfile.ci
          sed -i 's|^GENERATE_TREEVIEW *=.*|GENERATE_TREEVIEW = YES|' Doxyfile.ci
          sed -i 's|^HTML_COLORSTYLE *=.*|HTML_COLORSTYLE = LIGHT|' Doxyfile.ci

          # Include theme CSS + your overrides (overrides must come last)
          # Note: this REPLACES any existing HTML_EXTRA_STYLESHEET line.
          sed -i 's|^HTML_EXTRA_STYLESHEET *=.*|HTML_EXTRA_STYLESHEET = doxygen-awesome-css/doxygen-awesome.css \\\n  doxygen-awesome-css/doxygen-awesome-sidebar-only.css \\\n  docs/doxygen-custom.css|' Doxyfile.ci

      - name: Generate documentation
        shell: bash
        run: |
          set -euo pipefail
          doxygen Doxyfile.ci

          # Ensure Pages serves static HTML (no Jekyll processing)
          touch html/.nojekyll

          test -f html/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
