name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Build the binary
  build:
    name: Build Windows x86
    runs-on: windows-latest
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      semver: ${{ steps.gitversion.outputs.SemVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.5.1"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Install MSYS2 & MinGW32
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-i686-toolchain
          msystem: MINGW32

      - name: Generate version header
        shell: bash
        run: |
          VERSION_FULL="${{ steps.gitversion.outputs.SemVer }}"
          echo "VERSION_FULL=${VERSION_FULL}"
          mkdir -p src/lib
          cat > src/lib/version.h <<EOF
          #ifndef PINGDD_VERSION_H
          #define PINGDD_VERSION_H
          #define PINGDD_VERSION       "${VERSION_FULL}"
          #define PINGDD_VERSION_FULL  "${VERSION_FULL}"
          #endif /* PINGDD_VERSION_H */
          EOF

      - name: Build PingDD (32-bit)
        shell: msys2 {0}
        run: |
          echo "Using gcc:"
          gcc --version
          make clean
          make

      - name: Self-sign executable (Windows SDK)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install Windows SDK 10 (includes SignTool) via Chocolatey
          choco install windows-sdk-10.0 -y --force

          # Refresh environment
          refreshenv

          # Verify SignTool from multiple possible locations
          $signToolPaths = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools\x64\signtool.exe"
          )

          $signtool = $null
          foreach ($path in $signToolPaths) {
            if (Test-Path $path) {
              $signtool = $path
              Write-Output "✅ Found SignTool: $signtool"
              break
            }
          }

          if (-not $signtool) {
            throw "SignTool not found in expected locations"
          }

          # Add to PATH
          $env:PATH += ";$($signtool | Split-Path -Parent)"

          # Test
          & $signtool /?

          # Create self-signed cert
          $cert = New-SelfSignedCertificate -Subject "CN=PingDD Development" `
                                           -Type CodeSigningCert `
                                           -CertStoreLocation Cert:\CurrentUser\My `
                                           -KeyLength 2048 `
                                           -HashAlgorithm SHA256

          # Sign
          & $signtool sign /n "PingDD Development" `
                          /tr http://timestamp.digicert.com `
                          /td sha256 `
                          bin/win/pingdd.exe

          # Verify
          & $signtool verify /pa bin/win/pingdd.exe

          echo "✅ Self-signed successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingdd-win32-${{ steps.gitversion.outputs.SemVer }}-signed
          path: bin/win/x86/pingdd.exe

  # Job 2: Create tags (only on main)
  tag:
    name: Create Git tag
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag from GitVersion
        run: |
          VERSION="${{ needs.build.outputs.semver }}"
          TAG="v${VERSION}"
          echo "Creating tag: $TAG"
          # This would need checkout + git config to actually push tags
          echo "Tag would be: v${VERSION}"

  # Job 3: Create GitHub Release (only on main)
  release:
    name: Publish Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed binary
        uses: actions/download-artifact@v4
        with:
          name: pingdd-win32-${{ needs.build.outputs.semver }}-signed
          path: artifacts/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.semver }}
          name: PingDD ${{ needs.build.outputs.semver }}
          body: |
            Automated release for ${{ needs.build.outputs.semver }}
            **Full changelog:** [View commits](https://github.com/darthdemono/PingDD/compare/${{ github.ref_name }}...${{ github.sha }})
            - Commit: `${{ github.sha }}`
          artifacts: artifacts/pingdd.exe
          artifactContentType: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          skipIfReleaseExists: false
          replacesArtifacts: true
