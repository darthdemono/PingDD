name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Windows x86
  build-windows:
    name: Build Windows x86
    runs-on: windows-latest
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      semver: ${{ steps.gitversion.outputs.SemVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.5.1"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Install MSYS2 & MinGW32
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-i686-toolchain
          msystem: MINGW32

      - name: Generate version header
        shell: bash
        run: |
          VERSION_FULL="${{ steps.gitversion.outputs.SemVer }}"
          echo "VERSION_FULL=${VERSION_FULL}"
          mkdir -p src/lib
          cat > src/lib/version.h <<EOF
          #ifndef PINGDD_VERSION_H
          #define PINGDD_VERSION_H
          #define PINGDD_VERSION       "${VERSION_FULL}"
          #define PINGDD_VERSION_FULL  "${VERSION_FULL}"
          #endif /* PINGDD_VERSION_H */
          EOF

      - name: Build PingDD (32-bit)
        shell: msys2 {0}
        run: |
          echo "Using gcc:"
          gcc --version
          make clean
          make win32

      - name: Self-sign executable (Windows SDK)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install windows-sdk-10.0 -y --force
          refreshenv

          $signToolPaths = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26621.0\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe"
          )
          $signtool = $null
          foreach ($path in $signToolPaths) {
            if (Test-Path $path) {
              $signtool = $path
              Write-Output "✅ Found SignTool: $signtool"
              break
            }
          }
          $env:PATH += ";$($signtool | Split-Path -Parent)"

          $cert = New-SelfSignedCertificate -Subject "CN=PingDD Development" `
                                           -Type CodeSigningCert `
                                           -CertStoreLocation Cert:\CurrentUser\My `
                                           -KeyLength 2048 `
                                           -HashAlgorithm SHA256

          & $signtool sign /n "PingDD Development" /tr http://timestamp.digicert.com /td sha256 bin/win/pingdd.exe
          echo "✅ Self-signed: bin/win/pingdd.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingdd-win32-${{ steps.gitversion.outputs.SemVer }}-signed
          path: bin/win/pingdd.exe

  # Job 2: Multi-Distro Linux (FIXED)
  build-linux:
    name: Build Linux (${{ matrix.distro_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:24.04
            distro_name: ubuntu-24.04
          - distro: ubuntu:22.04
            distro_name: ubuntu-22.04
          - distro: debian:bookworm
            distro_name: debian-bookworm
          - distro: debian:bullseye
            distro_name: debian-bullseye
          - distro: fedora:40
            distro_name: fedora-40
          - distro: alpine:3.19
            distro_name: alpine-3.19
          - distro: quay.io/centos/centos:stream9
            distro_name: centos-stream9
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.5.1"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Generate version header
        run: |
          VERSION_FULL="${{ steps.gitversion.outputs.SemVer }}"
          echo "VERSION_FULL=${VERSION_FULL}"
          mkdir -p src/lib
          cat > src/lib/version.h <<EOF
          #ifndef PINGDD_VERSION_H
          #define PINGDD_VERSION_H
          #define PINGDD_VERSION       "${VERSION_FULL}"
          #define PINGDD_VERSION_FULL  "${VERSION_FULL}"
          #endif /* PINGDD_VERSION_H */
          EOF

      - name: Build on ${{ matrix.distro }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ matrix.distro }} \
            /bin/sh -c '
              # Install build tools per distro
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache gcc musl-dev make
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y gcc make glibc-devel
              elif command -v yum >/dev/null 2>&1; then
                yum install -y gcc make glibc-devel
              else
                apt-get update && apt-get install -y gcc make libc6-dev
              fi

              echo "GCC version:"
              gcc --version

              make clean
              make linux EXEC_SUFFIX="-${{ matrix.distro_name }}"
            '

      - name: Upload ${{ matrix.distro_name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingdd-${{ matrix.distro_name }}-${{ steps.gitversion.outputs.SemVer }}
          path: bin/linux/pingdd-${{ matrix.distro_name }}

  # Job 3: Create Release (FIXED)
  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: pingdd-*

      - name: List artifacts
        run: |
          echo "=== Artifacts structure ==="
          ls -laR artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Move all artifacts to a flat structure for release
          find artifacts -type f -name "pingdd*" -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build-windows.outputs.semver }}
          name: PingDD ${{ needs.build-windows.outputs.semver }}
          body: |
            # PingDD ${{ needs.build-windows.outputs.semver }}

            ## Downloads

            ### Windows
            - `pingdd.exe` - Windows 32-bit (signed)

            ### Linux Distributions
            - Ubuntu 24.04, 22.04
            - Debian Bookworm, Bullseye
            - Fedora 40
            - Alpine 3.19
            - CentOS Stream 9
          artifacts: "release-assets/*"
          artifactContentType: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
