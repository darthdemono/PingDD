name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # allow tag pushes too (e.g. v1.1.1)
  pull_request:
    branches: [main]

jobs:
  build-windows-mingw:
    name: Build (Windows, MinGW32 + make)
    runs-on: windows-latest

    permissions:
      contents: write # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 & MinGW32
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-i686-toolchain
          msystem: MINGW32

      - name: Show environment
        shell: msys2 {0}
        run: |
          pwd
          ls

      - name: Generate version header
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"          # e.g. v1.1.1 or 1.1.1
            VERSION_FULL="${RAW_TAG#v}"
          else
            VERSION_BASE="1.1"
            PATCH="${GITHUB_RUN_NUMBER}"
            VERSION_FULL="${VERSION_BASE}.${PATCH}"
          fi
          echo "VERSION_FULL=${VERSION_FULL}"
          mkdir -p src/lib
          cat > src/lib/version.h <<EOF
          #ifndef PINGDD_VERSION_H
          #define PINGDD_VERSION_H

          #define PINGDD_VERSION       "${VERSION_FULL}"
          #define PINGDD_VERSION_FULL  "${VERSION_FULL}"

          #endif /* PINGDD_VERSION_H */
          EOF

      - name: Build PingDD (32-bit)
        shell: msys2 {0}
        run: |
          echo "Using gcc:"
          gcc --version
          echo "Building with make..."
          make clean
          make

      - name: Compute short SHA
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (pingdd.exe)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pingdd-win32-${{ steps.vars.outputs.short_sha }}
          path: bin/win/x86/pingdd.exe

      # ----- Auto-release block: only runs on tag pushes -----
      - name: Create GitHub Release
        if: success() && github.ref_type == 'tag'
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: PingDD ${{ github.ref_name }}
          body: "Automated release for tag ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload exe to Release
        if: success() && github.ref_type == 'tag'
        uses: AButler/upload-release-assets@v3.0
        with:
          files: "bin/win/x86/pingdd.exe"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
