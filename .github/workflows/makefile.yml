name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # still handle existing tags if you ever push them
  pull_request:
    branches: [main]

jobs:
  build-windows-mingw:
    name: Build (Windows, MinGW32 + make)
    runs-on: windows-latest

    permissions:
      contents: write # needed to create tags/releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important for GitVersion

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.0.5"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      # --- Toolchain / build ---
      - name: Install MSYS2 & MinGW32
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-i686-toolchain
          msystem: MINGW32

      - name: Show environment
        shell: msys2 {0}
        run: |
          pwd
          ls

      - name: Generate version header from GitVersion
        shell: bash
        run: |
          VERSION_FULL="${{ steps.gitversion.outputs.SemVer }}"
          echo "VERSION_FULL=${VERSION_FULL}"
          mkdir -p src/lib
          cat > src/lib/version.h <<EOF
          #ifndef PINGDD_VERSION_H
          #define PINGDD_VERSION_H

          #define PINGDD_VERSION       "${VERSION_FULL}"
          #define PINGDD_VERSION_FULL  "${VERSION_FULL}"

          #endif /* PINGDD_VERSION_H */
          EOF

      - name: Build PingDD (32-bit)
        shell: msys2 {0}
        run: |
          echo "Using gcc:"
          gcc --version
          echo "Building with make..."
          make clean
          make

      # --- CI artifact for every run ---
      - name: Upload artifact (pingdd.exe)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pingdd-win32-${{ steps.gitversion.outputs.SemVer }}
          path: bin/win/x86/pingdd.exe

      # --- Create tag & release only on main branch pushes ---
      - name: Create Git tag from GitVersion
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="${{ steps.gitversion.outputs.SemVer }}"
          TAG="v${VERSION}"
          echo "TAG=${TAG}"
          # Create or move tag locally
          git tag -f "${TAG}"
          # Push tag to origin
          git push origin "${TAG}" --force

      - name: Create or update GitHub Release with asset
        if: success() && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.gitversion.outputs.SemVer }}
          name: PingDD ${{ steps.gitversion.outputs.SemVer }}
          body: "Automated release for ${{ steps.gitversion.outputs.SemVer }}"
          artifacts: "bin/win/x86/pingdd.exe"
          artifactContentType: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: false
          replacesArtifacts: true
